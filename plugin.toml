[plugin]
id = "titanfall2_player"
name = "泰坦陨落2 陪玩"
description = "让 N.E.K.O 亲自玩《泰坦陨落 2》：主人先手动打开游戏并进入关卡，再说「去玩泰坦陨落2」，猫娘会截屏观察、识别任务标记与战斗迹象、制定并执行跑酷/射击/泰坦策略、主动解说判断；玩家可随时碰键接手、按 F8 或说「停手」让她让位，也能随时加入一起操作。"
short_description = "Catgirl plays Titanfall 2: reads the HUD, plans out loud, and yields to you."
keywords = [
    "泰坦陨落", "泰坦陨落2", "泰坦陨落二", "神兵泰坦", "神兵泰坦2", "铁驭",
    "BT-7274", "BT7274", "泰坦", "titanfall", "titanfall2", "titanfall 2", "ttf2",
    "去玩", "开始玩", "陪我玩", "帮我玩", "你来玩", "你玩", "代打", "打通", "过关",
    "别再玩", "别玩了", "停手", "停下", "暂停", "我来", "我接手", "让我来",
    "继续", "接着玩", "你继续", "交给你", "接着打",
    "往前走", "往右走", "往左走", "后退", "跳", "二段跳", "滑铲", "跑墙", "冲刺",
    "按e", "开门", "登机", "上泰坦", "召唤泰坦", "开火", "射击", "瞄准", "换弹",
    "手雷", "近战", "战术技能", "泰坦核心", "现在在干嘛", "打到哪", "什么情况",
    "看到什么", "检查一下", "play", "autoplay", "autopilot", "take over", "stop",
]

version = "1.0.0"
type = "plugin"
entry = "plugin.plugins.titanfall2_player:Titanfall2PlayerPlugin"

[plugin.author]
name = "呆萌貔貅"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin_runtime]
enabled = true
# Manual start: enabling the plugin must not hijack the keyboard or begin
# playing.  The user (or the dialogue LLM) calls titan_play.
auto_start = false

# No persistent key/value data is needed, so [plugin.store] is omitted on
# purpose: only declare capabilities the plugin actually uses.
[plugin.ui]
enabled = true

# ---------------------------------------------------------------------------
# Titanfall 2 configuration.
#
# The table is named [titanfall2] rather than [titanfall2_player] on purpose: a
# table whose name equals the plugin id is migrated into the distribution
# profile, while any other top-level table stays in plugin.toml and is what
# `plugin.config.dump()` returns.  This mirrors the shipped game plugins.
# ---------------------------------------------------------------------------
[titanfall2]
# auto | dxgi | gdi | pil
#
# dxgi is our own pure-ctypes Desktop Duplication implementation; it sees
# exclusive-fullscreen games without OpenCV.  GDI is the always-available
# fallback for windowed/borderless.  A failing backend is quarantined and the
# next candidate is used.
capture_backend = "auto"
capture_monitor = 0

# Smallest believable game window/frame.  A minimised window is parked near
# (-32000, -32000) with an icon-sized rectangle; cropping to it yields a 1x1
# image that still looks bright, so it must be rejected explicitly.
min_capture_edge = 160

# Autopilot cadence and screenshot streaming.
target_fps = 4.0
frame_max_edge_px = 1024
frame_jpeg_quality = 75
# Raw JPEG byte budget per pushed frame (the wire format base64-encodes it).
frame_max_bytes = 102400
stream_frames_to_llm = true
frame_stream_interval_seconds = 8.0
# Proactive "here is what I see / here is what I will do" turns.  Each one is a
# real LLM turn, so keep it comfortable.
commentary_interval_seconds = 25.0
problem_cooldown_seconds = 60.0

# Refuse to inject input unless the game window is the foreground window.
require_foreground = true

# false = enabling the plugin does not start playing; use titan_play.
autopilot_enabled = false
autopilot_tick_seconds = 0.30

# true = watch and narrate only, never press a key.  Useful for a first run.
dry_run = false

# The game is opened BY HAND.  This plugin never starts a game on its own: the
# loop waits, and begins as soon as the Titanfall 2 window is visible.
# Hard stop so an unattended session cannot run forever.
max_session_minutes = 45.0

# Consecutive all-black frames before the plugin refuses to press keys.
blind_frame_limit = 8

# Press V when the bottom-centre Titan slot looks warm and the HUD is stable.
# The LLM's screenshot remains the source of truth; this is only a local hint.
auto_call_titan = true

# Mouse-look calibration.  Titanfall 2 is a modified Source engine.  The
# default is a starting point; closed-loop aiming tolerates an imperfect value.
# If turns overshoot, raise this; if they undershoot, lower it.
look_units_per_degree = 11.0
horizontal_fov = 90.0
vertical_fov = 59.0
invert_y = false

# "Jump in and play together": if the player presses WASD/fire/E etc. (keys the
# plugin is not holding), the catgirl releases everything and watches.  After
# this many idle seconds she resumes automatically.  F8 is a hard pause that
# only "继续"/titan_resume/F8 clears.
yield_on_human_input = true
human_input_grace_seconds = 12.0
pause_hotkey_enabled = true

# If the game shows a pause menu (cursor visible) without the player touching
# the controls, press Escape once to resume.  Never clicks "New Game".
auto_resume_from_menu = true
menu_stable_ticks = 3

# If true, the plugin refuses to play until it has actually seen gameplay
# (cursor hidden / HUD present).  This is what stops it from blindly clicking
# around the main menu and starting a new game over the user's save.
start_in_game_required = true

# Default objective; can be overridden with titan_play(objective=...).
objective = ""
plan_steps = []

# Per-action key overrides.  Keys use the names from the plugin's key table
# (w/a/s/d/e/r/q/g/f/c/space/ctrl/shift/mouse1/mouse2) and are applied on top of
# the catalogue defaults.  Verify these once in the game's own settings; the
# optional ability keys differ between public control references.
# Examples (uncomment to use):
# forward = "w"
# interact = "e"
# attack = "mouse1"
[titanfall2.keys]
